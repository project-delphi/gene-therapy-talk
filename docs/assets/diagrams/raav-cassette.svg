<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 456" width="1400" height="456"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="The recombinant AAV cassette budget. Two expression cassettes drawn to scale against the 4.7 kb packaging limit, showing how much of the budget regulatory elements consume and which therapeutic payloads still fit.">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#121a23"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2b3a48" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- scale: 0 .. 4.7 kb over x = 90 .. 1290 -->
  <g stroke="#44586b" fill="#6d8aa3" font-size="13" text-anchor="middle">
    <line x1="90" y1="42" x2="1290" y2="42" stroke-width="1"/>
    <line x1="90"   y1="38" x2="90"   y2="46"/><text x="90"   y="29">0</text>
    <line x1="345"  y1="38" x2="345"  y2="46"/><text x="345"  y="29">1 kb</text>
    <line x1="600"  y1="38" x2="600"  y2="46"/><text x="600"  y="29">2 kb</text>
    <line x1="855"  y1="38" x2="855"  y2="46"/><text x="855"  y="29">3 kb</text>
    <line x1="1110" y1="38" x2="1110" y2="46"/><text x="1110" y="29">4 kb</text>
  </g>
  <line x1="1290" y1="36" x2="1290" y2="300" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1286" y="20" fill="#f43f5e" font-size="14" text-anchor="end">4.7 kb packaging limit</text>

  <!-- cassette A: generous regulatory package -->
  <text x="90" y="82" fill="#f2f7fa" font-size="17">Generous regulatory package</text>
  <g>
    <rect x="90"   y="94" width="37"  height="46" rx="3" fill="#fb923c"/>
    <rect x="127"  y="94" width="434" height="46" rx="3" fill="#14b8a6"/>
    <rect x="561"  y="94" width="475" height="46" rx="3" fill="url(#hatch)" stroke="#44586b" stroke-width="1"/>
    <rect x="1036" y="94" width="153" height="46" rx="3" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="1189" y="94" width="64"  height="46" rx="3" fill="#64748b"/>
    <rect x="1253" y="94" width="37"  height="46" rx="3" fill="#fb923c"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#f2f7fa">
    <text x="344" y="123">CAG promoter 1.7 kb</text>
    <text x="798" y="118" fill="#c5d6e4" font-size="15">transgene</text>
    <text x="798" y="135" fill="#6d8aa3">1.86 kb left</text>
    <text x="1112" y="123" fill="#0e2a3a">WPRE</text>
  </g>
  <g font-size="12" fill="#6d8aa3" text-anchor="middle">
    <text x="108" y="158">ITR</text>
    <text x="1221" y="158">polyA</text>
    <text x="1271" y="158">ITR</text>
  </g>

  <!-- cassette B: compact -->
  <text x="90" y="200" fill="#f2f7fa" font-size="17">Compact package</text>
  <g>
    <rect x="90"   y="212" width="37"  height="46" rx="3" fill="#fb923c"/>
    <rect x="127"  y="212" width="204" height="46" rx="3" fill="#14b8a6"/>
    <rect x="331"  y="212" width="896" height="46" rx="3" fill="url(#hatch)" stroke="#44586b" stroke-width="1"/>
    <rect x="1227" y="212" width="26"  height="46" rx="3" fill="#64748b"/>
    <rect x="1253" y="212" width="37"  height="46" rx="3" fill="#fb923c"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#f2f7fa">
    <text x="229" y="241">CBh 0.8 kb</text>
    <text x="779" y="236" fill="#c5d6e4" font-size="15">transgene</text>
    <text x="779" y="253" fill="#6d8aa3">3.51 kb left</text>
  </g>
  <g font-size="12" fill="#6d8aa3" text-anchor="middle">
    <text x="108" y="276">ITR</text>
    <text x="1240" y="276">pA</text>
    <text x="1271" y="276">ITR</text>
  </g>

  <!-- element order note -->
  <text x="90" y="310" fill="#2dd4bf" font-size="14">
    Order matters: WPRE sits in the 3′ UTR <tspan font-weight="bold">upstream</tspan> of the polyA signal, or it does nothing.
  </text>

  <!-- payloads, same scale, so they can be read straight off the budget above -->
  <text x="90" y="352" fill="#f2f7fa" font-size="17">Coding sequences, to the same scale</text>
  <g font-size="13">
    <rect x="90" y="364" width="357" height="22" rx="3" fill="#4ade80" fill-opacity="0.6"/>
    <text x="102" y="380" fill="#f2f7fa">Factor IX — 1.4 kb</text>
    <text x="459" y="380" fill="#6d8aa3">fits either cassette</text>

    <rect x="90" y="392" width="969" height="22" rx="3" fill="#fbbf24" fill-opacity="0.6"/>
    <text x="102" y="408" fill="#07090c">micro-dystrophin — 3.8 kb</text>
    <text x="1071" y="408" fill="#6d8aa3">compact package only</text>

    <rect x="90" y="420" width="1123" height="22" rx="3" fill="#f43f5e" fill-opacity="0.6"/>
    <text x="102" y="436" fill="#f2f7fa">B-domain-deleted Factor VIII — 4.4 kb</text>
    <text x="1225" y="436" fill="#fb923c">no room left</text>
  </g>
</svg>
