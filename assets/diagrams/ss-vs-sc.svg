<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 530" width="1400" height="530"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="Single-stranded AAV compared with self-complementary AAV. Deleting the terminal resolution site from one ITR stops Rep resolving it, so the genome is packaged as a covalently linked dimer that snap-anneals on release, trading half the packaging capacity for immediate expression.">
  <defs>
    <marker id="dn" markerWidth="9" markerHeight="8" refX="4.5" refY="7" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 z" fill="#3b4c5c"/>
    </marker>
  </defs>

  <line x1="700" y1="40" x2="700" y2="500" stroke="#1e2a36" stroke-width="1"/>

  <!-- ================= ssAAV ================= -->
  <text x="50" y="62" fill="#f2f7fa" font-size="22">ssAAV</text>
  <text x="140" y="62" fill="#6d8aa3" font-size="15">— both ITRs intact</text>

  <text x="50" y="108" fill="#9fb3c8" font-size="14">Packaged genome: one strand, either polarity</text>
  <g>
    <rect x="50"  y="124" width="34" height="30" rx="3" fill="#fb923c"/>
    <rect x="84"  y="131" width="500" height="16" fill="#14b8a6"/>
    <rect x="584" y="124" width="34" height="30" rx="3" fill="#fb923c"/>
    <text x="334" y="144" fill="#f2f7fa" font-size="13" text-anchor="middle">expression cassette</text>
    <text x="634" y="145" fill="#2dd4bf" font-size="15">up to 4.7 kb</text>
  </g>

  <line x1="334" y1="176" x2="334" y2="216" stroke="#3b4c5c" stroke-width="2" marker-end="url(#dn)"/>
  <text x="352" y="202" fill="#fb923c" font-size="14">host polymerase must synthesise the complement</text>

  <text x="50" y="256" fill="#9fb3c8" font-size="14">Transcribable form</text>
  <g>
    <rect x="50"  y="272" width="34" height="34" rx="3" fill="#fb923c"/>
    <rect x="84"  y="275" width="500" height="13" fill="#14b8a6"/>
    <rect x="84"  y="291" width="500" height="13" fill="#38bdf8"/>
    <rect x="584" y="272" width="34" height="34" rx="3" fill="#fb923c"/>
  </g>

  <rect x="50" y="340" width="568" height="70" rx="6" fill="#121a23" stroke="#2b3a48"/>
  <text x="68" y="368" fill="#f2f7fa" font-size="15">Onset: days to weeks</text>
  <text x="68" y="392" fill="#6d8aa3" font-size="13">Full capacity. Second-strand synthesis is the rate-limiting step.</text>

  <text x="50" y="446" fill="#9fb3c8" font-size="14">Used for</text>
  <text x="50" y="470" fill="#c5d6e4" font-size="14">Payloads that need the space — B-domain-deleted Factor VIII,</text>
  <text x="50" y="492" fill="#c5d6e4" font-size="14">micro-dystrophin, larger enzymes.</text>

  <!-- ================= scAAV ================= -->
  <text x="750" y="62" fill="#f2f7fa" font-size="22">scAAV</text>
  <text x="845" y="62" fill="#6d8aa3" font-size="15">— one ITR has the trs deleted</text>

  <text x="750" y="108" fill="#9fb3c8" font-size="14">Packaged genome: a covalently linked dimer</text>
  <g>
    <rect x="750"  y="124" width="34" height="30" rx="3" fill="#fb923c"/>
    <rect x="784"  y="131" width="236" height="16" fill="#14b8a6"/>
    <path d="M1020,124 a22,15 0 0 1 0,30 z" fill="#64748b"/>
    <rect x="1020" y="124" width="4" height="30" fill="#64748b"/>
    <rect x="786"  y="158" width="234" height="16" fill="#38bdf8"/>
    <rect x="750"  y="151" width="36" height="30" rx="3" fill="#fb923c"/>
    <text x="902" y="144" fill="#f2f7fa" font-size="12.5" text-anchor="middle">cassette</text>
    <text x="903" y="171" fill="#0e2a3a" font-size="12.5" text-anchor="middle">complement</text>
    <text x="1046" y="135" fill="#64748b" font-size="13">mutant ITR</text>
    <text x="1046" y="152" fill="#64748b" font-size="13">(Δtrs) — Rep</text>
    <text x="1046" y="169" fill="#64748b" font-size="13">cannot nick it</text>
    <text x="750" y="208" fill="#2dd4bf" font-size="15">up to 2.2 kb of cassette</text>
  </g>

  <line x1="900" y1="228" x2="900" y2="258" stroke="#3b4c5c" stroke-width="2" marker-end="url(#dn)"/>
  <text x="918" y="250" fill="#2dd4bf" font-size="14">snap-anneals on release — no synthesis needed</text>

  <text x="750" y="290" fill="#9fb3c8" font-size="14">Transcribable form, immediately</text>
  <g>
    <rect x="750"  y="300" width="34" height="34" rx="3" fill="#fb923c"/>
    <rect x="784"  y="303" width="236" height="13" fill="#14b8a6"/>
    <rect x="784"  y="319" width="236" height="13" fill="#38bdf8"/>
    <path d="M1020,300 a20,17 0 0 1 0,34 z" fill="#64748b"/>
  </g>

  <rect x="750" y="340" width="568" height="70" rx="6" fill="#121a23" stroke="#2dd4bf"/>
  <text x="768" y="368" fill="#f2f7fa" font-size="15">Onset: hours to days</text>
  <text x="768" y="392" fill="#6d8aa3" font-size="13">Half the capacity, because the genome is carrying its own complement.</text>

  <text x="750" y="446" fill="#9fb3c8" font-size="14">Used for</text>
  <text x="750" y="470" fill="#c5d6e4" font-size="14">Small payloads where onset matters — shRNA and miRNA,</text>
  <text x="750" y="492" fill="#c5d6e4" font-size="14">compact enzymes, Factor IX.</text>
</svg>
