<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="The rAAV transduction pathway as an eight-step pipeline, from glycan attachment to the circularised episome, with a narrowing band underneath showing that vector genomes are lost at every step. Endosomal escape and second-strand synthesis are marked as the dominant bottlenecks.">
  <defs>
    <marker id="step" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b4c5c"/>
    </marker>
    <linearGradient id="attrition" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- step boxes -->
  <g>
    <!-- 1 -->
    <rect x="45" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="68" cy="83" r="14" fill="#14b8a6"/><text x="68" y="88" font-size="14" fill="#fff" text-anchor="middle">1</text>
    <text x="92" y="88" font-size="14.5" fill="#f2f7fa">Attachment</text>
    <text x="59" y="118" font-size="12.5" fill="#9fb3c8">Glycan receptor —</text>
    <text x="59" y="135" font-size="12.5" fill="#9fb3c8">HSPG for AAV2,</text>
    <text x="59" y="152" font-size="12.5" fill="#9fb3c8">galactose for AAV9</text>
    <text x="59" y="176" font-size="12" fill="#2dd4bf">+ AAVR co-receptor</text>

    <!-- 2 -->
    <rect x="210" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="233" cy="83" r="14" fill="#14b8a6"/><text x="233" y="88" font-size="14" fill="#fff" text-anchor="middle">2</text>
    <text x="257" y="88" font-size="14.5" fill="#f2f7fa">Endocytosis</text>
    <text x="224" y="118" font-size="12.5" fill="#9fb3c8">Clathrin-mediated</text>
    <text x="224" y="135" font-size="12.5" fill="#9fb3c8">uptake into early</text>
    <text x="224" y="152" font-size="12.5" fill="#9fb3c8">endosomes</text>

    <!-- 3 -->
    <rect x="375" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="398" cy="83" r="14" fill="#14b8a6"/><text x="398" y="88" font-size="14" fill="#fff" text-anchor="middle">3</text>
    <text x="422" y="88" font-size="14.5" fill="#f2f7fa">Trafficking</text>
    <text x="389" y="118" font-size="12.5" fill="#9fb3c8">Retrograde route</text>
    <text x="389" y="135" font-size="12.5" fill="#9fb3c8">through the</text>
    <text x="389" y="152" font-size="12.5" fill="#9fb3c8">trans-Golgi network</text>

    <!-- 4 -->
    <rect x="540" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#fb923c" stroke-width="1.8"/>
    <circle cx="563" cy="83" r="14" fill="#fb923c"/><text x="563" y="88" font-size="14" fill="#07090c" text-anchor="middle">4</text>
    <text x="587" y="88" font-size="14.5" fill="#f2f7fa">Escape</text>
    <text x="554" y="118" font-size="12.5" fill="#9fb3c8">VP1u PLA₂ domain</text>
    <text x="554" y="135" font-size="12.5" fill="#9fb3c8">externalised at low</text>
    <text x="554" y="152" font-size="12.5" fill="#9fb3c8">pH, breaches endosome</text>
    <text x="554" y="176" font-size="12" fill="#fb923c">bottleneck</text>

    <!-- 5 -->
    <rect x="705" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="728" cy="83" r="14" fill="#14b8a6"/><text x="728" y="88" font-size="14" fill="#fff" text-anchor="middle">5</text>
    <text x="752" y="88" font-size="14.5" fill="#f2f7fa">Nuclear import</text>
    <text x="719" y="118" font-size="12.5" fill="#9fb3c8">Through the NPC —</text>
    <text x="719" y="135" font-size="12.5" fill="#9fb3c8">capsid still largely</text>
    <text x="719" y="152" font-size="12.5" fill="#9fb3c8">intact</text>

    <!-- 6 -->
    <rect x="870" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="893" cy="83" r="14" fill="#14b8a6"/><text x="893" y="88" font-size="14" fill="#fff" text-anchor="middle">6</text>
    <text x="917" y="88" font-size="14.5" fill="#f2f7fa">Uncoating</text>
    <text x="884" y="118" font-size="12.5" fill="#9fb3c8">Late and nuclear —</text>
    <text x="884" y="135" font-size="12.5" fill="#9fb3c8">unusual among</text>
    <text x="884" y="152" font-size="12.5" fill="#9fb3c8">DNA viruses</text>

    <!-- 7 -->
    <rect x="1035" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#fb923c" stroke-width="1.8"/>
    <circle cx="1058" cy="83" r="14" fill="#fb923c"/><text x="1058" y="88" font-size="14" fill="#07090c" text-anchor="middle">7</text>
    <text x="1082" y="88" font-size="14.5" fill="#f2f7fa">2nd strand</text>
    <text x="1049" y="118" font-size="12.5" fill="#9fb3c8">ssDNA converted to</text>
    <text x="1049" y="135" font-size="12.5" fill="#9fb3c8">transcribable dsDNA</text>
    <text x="1049" y="176" font-size="12" fill="#fb923c">rate-limiting</text>

    <!-- 8 -->
    <rect x="1200" y="60" width="155" height="132" rx="7" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="1223" cy="83" r="14" fill="#14b8a6"/><text x="1223" y="88" font-size="14" fill="#fff" text-anchor="middle">8</text>
    <text x="1247" y="88" font-size="14.5" fill="#f2f7fa">Episome</text>
    <text x="1214" y="118" font-size="12.5" fill="#9fb3c8">ITR-mediated</text>
    <text x="1214" y="135" font-size="12.5" fill="#9fb3c8">circularisation and</text>
    <text x="1214" y="152" font-size="12.5" fill="#9fb3c8">concatemerisation</text>
    <text x="1214" y="176" font-size="12" fill="#2dd4bf">chromatinised</text>
  </g>

  <!-- connectors -->
  <g stroke="#3b4c5c" stroke-width="2" marker-end="url(#step)">
    <line x1="201" y1="126" x2="207" y2="126"/>
    <line x1="366" y1="126" x2="372" y2="126"/>
    <line x1="531" y1="126" x2="537" y2="126"/>
    <line x1="696" y1="126" x2="702" y2="126"/>
    <line x1="861" y1="126" x2="867" y2="126"/>
    <line x1="1026" y1="126" x2="1032" y2="126"/>
    <line x1="1191" y1="126" x2="1197" y2="126"/>
  </g>

  <!-- attrition band: the dose that is still in play after each step -->
  <text x="45" y="252" fill="#f2f7fa" font-size="16">Vector genomes still in play</text>
  <path d="M45,270 L210,286 L375,300 L540,312 L705,344 L870,356 L1035,366 L1200,392 L1355,400
           L1355,424 L1200,420 L1035,414 L870,410 L705,406 L540,392 L375,388 L210,384 L45,380 Z"
        fill="url(#attrition)"/>
  <g font-size="11.5" fill="#6d8aa3" text-anchor="middle">
    <text x="122" y="446">dose applied</text>
    <text x="617" y="446">most lost in the endosome</text>
    <text x="1112" y="446">most of the rest never converted</text>
  </g>

  <text x="45" y="492" fill="#9fb3c8" font-size="14">
    Every arrow is a place vectors are lost. Potency engineering is mostly an attempt to widen steps
    <tspan fill="#fb923c">4</tspan> and <tspan fill="#fb923c">7</tspan>.
  </text>
  <text x="45" y="518" fill="#6d8aa3" font-size="13">
    scAAV skips step 7 entirely — at the cost of half the packaging capacity.
  </text>
</svg>
