<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="Deep mutational scanning compared with directed evolution. In deep mutational scanning a comprehensive library containing every variant is put through one selection, the population is sequenced before and after, and each variant's fitness is the log ratio of its counts — so every variant is measured, including the ones that died. Directed evolution runs the same selection but keeps only the enriched survivors, discarding the failures. A note states that the failures are what tell a model where viability ends, which is why machine learning results arrived when deep mutational scanning did.">
  <defs>
    <marker id="m-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a5f72"/>
    </marker>
    <marker id="m-arrow-mag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f472b6"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="13" fill="#9fb3c8">You are not screening and picking. You are counting — and the count exists for every variant, not just the good ones.</text>

  <!-- ===================== 1 · comprehensive library ===================== -->
  <text x="40" y="76" font-size="15.5" fill="#f2f7fa">1 · Comprehensive library</text>
  <text x="40" y="96" font-size="12" fill="#9fb3c8">every variant you care about is present</text>

  <g>
    <!-- a grid of variants; each square is one sequence, its own barcode -->
    <g fill="#2b3a48">
      <rect x="40"  y="116" width="14" height="14" rx="2"/><rect x="58"  y="116" width="14" height="14" rx="2"/>
      <rect x="76"  y="116" width="14" height="14" rx="2"/><rect x="94"  y="116" width="14" height="14" rx="2"/>
      <rect x="112" y="116" width="14" height="14" rx="2"/><rect x="130" y="116" width="14" height="14" rx="2"/>
      <rect x="148" y="116" width="14" height="14" rx="2"/><rect x="166" y="116" width="14" height="14" rx="2"/>
      <rect x="184" y="116" width="14" height="14" rx="2"/><rect x="202" y="116" width="14" height="14" rx="2"/>
      <rect x="40"  y="134" width="14" height="14" rx="2"/><rect x="58"  y="134" width="14" height="14" rx="2"/>
      <rect x="76"  y="134" width="14" height="14" rx="2"/><rect x="94"  y="134" width="14" height="14" rx="2"/>
      <rect x="112" y="134" width="14" height="14" rx="2"/><rect x="130" y="134" width="14" height="14" rx="2"/>
      <rect x="148" y="134" width="14" height="14" rx="2"/><rect x="166" y="134" width="14" height="14" rx="2"/>
      <rect x="184" y="134" width="14" height="14" rx="2"/><rect x="202" y="134" width="14" height="14" rx="2"/>
      <rect x="40"  y="152" width="14" height="14" rx="2"/><rect x="58"  y="152" width="14" height="14" rx="2"/>
      <rect x="76"  y="152" width="14" height="14" rx="2"/><rect x="94"  y="152" width="14" height="14" rx="2"/>
      <rect x="112" y="152" width="14" height="14" rx="2"/><rect x="130" y="152" width="14" height="14" rx="2"/>
      <rect x="148" y="152" width="14" height="14" rx="2"/><rect x="166" y="152" width="14" height="14" rx="2"/>
      <rect x="184" y="152" width="14" height="14" rx="2"/><rect x="202" y="152" width="14" height="14" rx="2"/>
      <rect x="40"  y="170" width="14" height="14" rx="2"/><rect x="58"  y="170" width="14" height="14" rx="2"/>
      <rect x="76"  y="170" width="14" height="14" rx="2"/><rect x="94"  y="170" width="14" height="14" rx="2"/>
      <rect x="112" y="170" width="14" height="14" rx="2"/><rect x="130" y="170" width="14" height="14" rx="2"/>
      <rect x="148" y="170" width="14" height="14" rx="2"/><rect x="166" y="170" width="14" height="14" rx="2"/>
      <rect x="184" y="170" width="14" height="14" rx="2"/><rect x="202" y="170" width="14" height="14" rx="2"/>
      <rect x="40"  y="188" width="14" height="14" rx="2"/><rect x="58"  y="188" width="14" height="14" rx="2"/>
      <rect x="76"  y="188" width="14" height="14" rx="2"/><rect x="94"  y="188" width="14" height="14" rx="2"/>
      <rect x="112" y="188" width="14" height="14" rx="2"/><rect x="130" y="188" width="14" height="14" rx="2"/>
      <rect x="148" y="188" width="14" height="14" rx="2"/><rect x="166" y="188" width="14" height="14" rx="2"/>
      <rect x="184" y="188" width="14" height="14" rx="2"/><rect x="202" y="188" width="14" height="14" rx="2"/>
    </g>
    <text x="128" y="226" font-size="11.5" fill="#6d8299" text-anchor="middle">each variant is its own barcode</text>
  </g>

  <line x1="236" y1="160" x2="282" y2="160" stroke="#4a5f72" stroke-width="2" marker-end="url(#m-arrow)"/>
  <text x="259" y="150" font-size="11" fill="#6d8299" text-anchor="middle">pool</text>

  <!-- ===================== 2 · one selection ===================== -->
  <text x="306" y="76" font-size="15.5" fill="#f2f7fa">2 · One selection</text>
  <text x="306" y="96" font-size="12" fill="#9fb3c8">packaging, or a round in vivo</text>

  <rect x="306" y="116" width="150" height="86" rx="8" fill="#121a23" stroke="#2b3a48"/>
  <path d="M330,150 q24,-18 48,0 q24,18 48,0" fill="none" stroke="#2dd4bf" stroke-width="2.4"/>
  <path d="M330,176 q24,-18 48,0 q24,18 48,0" fill="none" stroke="#2dd4bf" stroke-width="2.4" opacity="0.5"/>
  <text x="381" y="226" font-size="11.5" fill="#6d8299" text-anchor="middle">the whole library, one tube</text>

  <line x1="470" y1="160" x2="516" y2="160" stroke="#4a5f72" stroke-width="2" marker-end="url(#m-arrow)"/>

  <!-- ===================== 3 · sequence before and after ===================== -->
  <text x="540" y="76" font-size="15.5" fill="#f2f7fa">3 · Count, before and after</text>
  <text x="540" y="96" font-size="12" fill="#9fb3c8">the readout is sequencing depth, nothing more</text>

  <g>
    <text x="540" y="128" font-size="12" fill="#9fb3c8">before</text>
    <g fill="#3b4c5c">
      <rect x="592" y="116" width="11" height="16" rx="2"/><rect x="607" y="116" width="11" height="16" rx="2"/>
      <rect x="622" y="116" width="11" height="16" rx="2"/><rect x="637" y="116" width="11" height="16" rx="2"/>
      <rect x="652" y="116" width="11" height="16" rx="2"/><rect x="667" y="116" width="11" height="16" rx="2"/>
      <rect x="682" y="116" width="11" height="16" rx="2"/><rect x="697" y="116" width="11" height="16" rx="2"/>
    </g>
    <text x="540" y="168" font-size="12" fill="#9fb3c8">after</text>
    <g>
      <rect x="592" y="156" width="11" height="16" rx="2" fill="#4ade80"/>
      <rect x="607" y="156" width="11" height="16" rx="2" fill="#4ade80"/>
      <rect x="622" y="156" width="11" height="16" rx="2" fill="#4ade80"/>
      <rect x="637" y="156" width="11" height="16" rx="2" fill="#4ade80"/>
      <rect x="652" y="156" width="11" height="16" rx="2" fill="#fbbf24"/>
      <rect x="667" y="156" width="11" height="16" rx="2" fill="#2b3a48"/>
      <rect x="682" y="156" width="11" height="16" rx="2" fill="#2b3a48"/>
      <rect x="697" y="156" width="11" height="16" rx="2" fill="#2b3a48"/>
    </g>
  </g>

  <rect x="540" y="196" width="190" height="40" rx="6" fill="#121a23" stroke="#2b3a48"/>
  <text x="635" y="222" font-size="14" fill="#f2f7fa" text-anchor="middle">fitness = log(after / before)</text>

  <line x1="748" y1="160" x2="794" y2="160" stroke="#4a5f72" stroke-width="2" marker-end="url(#m-arrow)"/>

  <!-- ===================== 4 · a measurement for every variant ===================== -->
  <text x="818" y="76" font-size="15.5" fill="#f2f7fa">4 · A value for every variant</text>
  <text x="818" y="96" font-size="12" fill="#9fb3c8">enriched, neutral and dead alike</text>

  <g>
    <rect x="818" y="116" width="14" height="14" rx="2" fill="#4ade80"/><rect x="836" y="116" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="854" y="116" width="14" height="14" rx="2" fill="#fb7185"/><rect x="872" y="116" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="890" y="116" width="14" height="14" rx="2" fill="#fb7185"/><rect x="908" y="116" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="926" y="116" width="14" height="14" rx="2" fill="#fbbf24"/><rect x="944" y="116" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="962" y="116" width="14" height="14" rx="2" fill="#fb7185"/><rect x="980" y="116" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="818" y="134" width="14" height="14" rx="2" fill="#fb7185"/><rect x="836" y="134" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="854" y="134" width="14" height="14" rx="2" fill="#fb7185"/><rect x="872" y="134" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="890" y="134" width="14" height="14" rx="2" fill="#fbbf24"/><rect x="908" y="134" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="926" y="134" width="14" height="14" rx="2" fill="#fb7185"/><rect x="944" y="134" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="962" y="134" width="14" height="14" rx="2" fill="#4ade80"/><rect x="980" y="134" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="818" y="152" width="14" height="14" rx="2" fill="#fbbf24"/><rect x="836" y="152" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="854" y="152" width="14" height="14" rx="2" fill="#4ade80"/><rect x="872" y="152" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="890" y="152" width="14" height="14" rx="2" fill="#fb7185"/><rect x="908" y="152" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="926" y="152" width="14" height="14" rx="2" fill="#fb7185"/><rect x="944" y="152" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="962" y="152" width="14" height="14" rx="2" fill="#fb7185"/><rect x="980" y="152" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="818" y="170" width="14" height="14" rx="2" fill="#fb7185"/><rect x="836" y="170" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="854" y="170" width="14" height="14" rx="2" fill="#fbbf24"/><rect x="872" y="170" width="14" height="14" rx="2" fill="#4ade80"/>
    <rect x="890" y="170" width="14" height="14" rx="2" fill="#fb7185"/><rect x="908" y="170" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="926" y="170" width="14" height="14" rx="2" fill="#4ade80"/><rect x="944" y="170" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="962" y="170" width="14" height="14" rx="2" fill="#fb7185"/><rect x="980" y="170" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="818" y="188" width="14" height="14" rx="2" fill="#4ade80"/><rect x="836" y="188" width="14" height="14" rx="2" fill="#fbbf24"/>
    <rect x="854" y="188" width="14" height="14" rx="2" fill="#fb7185"/><rect x="872" y="188" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="890" y="188" width="14" height="14" rx="2" fill="#4ade80"/><rect x="908" y="188" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="926" y="188" width="14" height="14" rx="2" fill="#fbbf24"/><rect x="944" y="188" width="14" height="14" rx="2" fill="#fb7185"/>
    <rect x="962" y="188" width="14" height="14" rx="2" fill="#fb7185"/><rect x="980" y="188" width="14" height="14" rx="2" fill="#4ade80"/>
  </g>
  <g font-size="11">
    <rect x="1008" y="118" width="12" height="12" rx="2" fill="#4ade80"/><text x="1026" y="128" fill="#9fb3c8">enriched</text>
    <rect x="1008" y="140" width="12" height="12" rx="2" fill="#fbbf24"/><text x="1026" y="150" fill="#9fb3c8">neutral</text>
    <rect x="1008" y="162" width="12" height="12" rx="2" fill="#fb7185"/><text x="1026" y="172" fill="#9fb3c8">dead</text>
  </g>
  <text x="899" y="226" font-size="11.5" fill="#2dd4bf" text-anchor="middle">millions of variants, one experiment</text>

  <!-- the model this feeds -->
  <line x1="1100" y1="160" x2="1146" y2="160" stroke="#4a5f72" stroke-width="2" marker-end="url(#m-arrow)"/>
  <rect x="1154" y="116" width="206" height="86" rx="8" fill="#1d1830" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="1257" y="148" font-size="14" fill="#c4b5fd" text-anchor="middle">a fitness landscape</text>
  <text x="1257" y="172" font-size="11.5" fill="#9fb3c8" text-anchor="middle">enough labels to fit a model</text>
  <text x="1257" y="190" font-size="11.5" fill="#9fb3c8" text-anchor="middle">that extrapolates</text>

  <!-- ===================== the contrast ===================== -->
  <line x1="40" y1="266" x2="1360" y2="266" stroke="#1d2935" stroke-width="2"/>

  <text x="40" y="300" font-size="15.5" fill="#fb7185">The same selection, run the old way</text>

  <g>
    <!-- directed evolution: keep the winners, bin the rest -->
    <g>
      <rect x="40"  y="322" width="14" height="14" rx="2" fill="#4ade80"/><rect x="58"  y="322" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="76"  y="322" width="14" height="14" rx="2" fill="#1a2028"/><rect x="94"  y="322" width="14" height="14" rx="2" fill="#4ade80"/>
      <rect x="112" y="322" width="14" height="14" rx="2" fill="#1a2028"/><rect x="130" y="322" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="148" y="322" width="14" height="14" rx="2" fill="#1a2028"/><rect x="166" y="322" width="14" height="14" rx="2" fill="#4ade80"/>
      <rect x="184" y="322" width="14" height="14" rx="2" fill="#1a2028"/><rect x="202" y="322" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="40"  y="340" width="14" height="14" rx="2" fill="#1a2028"/><rect x="58"  y="340" width="14" height="14" rx="2" fill="#4ade80"/>
      <rect x="76"  y="340" width="14" height="14" rx="2" fill="#1a2028"/><rect x="94"  y="340" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="112" y="340" width="14" height="14" rx="2" fill="#1a2028"/><rect x="130" y="340" width="14" height="14" rx="2" fill="#4ade80"/>
      <rect x="148" y="340" width="14" height="14" rx="2" fill="#1a2028"/><rect x="166" y="340" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="184" y="340" width="14" height="14" rx="2" fill="#4ade80"/><rect x="202" y="340" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="40"  y="358" width="14" height="14" rx="2" fill="#1a2028"/><rect x="58"  y="358" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="76"  y="358" width="14" height="14" rx="2" fill="#4ade80"/><rect x="94"  y="358" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="112" y="358" width="14" height="14" rx="2" fill="#1a2028"/><rect x="130" y="358" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="148" y="358" width="14" height="14" rx="2" fill="#1a2028"/><rect x="166" y="358" width="14" height="14" rx="2" fill="#1a2028"/>
      <rect x="184" y="358" width="14" height="14" rx="2" fill="#1a2028"/><rect x="202" y="358" width="14" height="14" rx="2" fill="#4ade80"/>
    </g>
    <text x="128" y="396" font-size="11.5" fill="#9fb3c8" text-anchor="middle">only the enriched are read</text>
  </g>

  <line x1="236" y1="348" x2="282" y2="348" stroke="#f472b6" stroke-width="2" marker-end="url(#m-arrow-mag)"/>

  <rect x="306" y="314" width="240" height="68" rx="8" fill="#121a23" stroke="#2b3a48"/>
  <text x="426" y="342" font-size="14" fill="#4ade80" text-anchor="middle">a handful of winners</text>
  <text x="426" y="364" font-size="11.5" fill="#9fb3c8" text-anchor="middle">useful reagents, no landscape</text>

  <g>
    <rect x="590" y="314" width="300" height="68" rx="8" fill="#1a1416" stroke="#8a4a4a"/>
    <text x="740" y="342" font-size="14" fill="#fb7185" text-anchor="middle">everything else: discarded</text>
    <text x="740" y="364" font-size="11.5" fill="#d8c0c4" text-anchor="middle">the failures are never counted</text>
  </g>

  <text x="930" y="334" font-size="13" fill="#9fb3c8">A model trained only on survivors cannot</text>
  <text x="930" y="354" font-size="13" fill="#9fb3c8">tell you where the edges are.</text>
  <text x="930" y="378" font-size="13" fill="#fb923c">Failures are the informative half.</text>

  <text x="40" y="452" font-size="13" fill="#f472b6">This is why the machine-learning results arrived when deep mutational scanning did, and not before — the method did not change, the data did.</text>
</svg>
