<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="The systemic rAAV therapeutic window. Efficacy rises with dose, but so does toxicity — capsid-specific T cell responses, complement activation, hepatotoxicity, thrombotic microangiopathy and dorsal root ganglion toxicity — leaving a narrow usable band. A more potent capsid shifts the efficacy curve left and widens the window.">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.06"/>
    </linearGradient>
    <marker id="shift" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- plot frame: x = 80..1320 spans 1e11 .. 1e15 vg/kg, one decade = 310 px -->
  <line x1="80" y1="340" x2="1330" y2="340" stroke="#44586b" stroke-width="1.5"/>
  <line x1="80" y1="80"  x2="80"  y2="340" stroke="#44586b" stroke-width="1.5"/>

  <g fill="#6d8aa3" font-size="13" text-anchor="middle">
    <line x1="80"   y1="340" x2="80"   y2="347" stroke="#44586b"/><text x="80"   y="366">10¹¹</text>
    <line x1="390"  y1="340" x2="390"  y2="347" stroke="#44586b"/><text x="390"  y="366">10¹²</text>
    <line x1="700"  y1="340" x2="700"  y2="347" stroke="#44586b"/><text x="700"  y="366">10¹³</text>
    <line x1="1010" y1="340" x2="1010" y2="347" stroke="#44586b"/><text x="1010" y="366">10¹⁴</text>
    <line x1="1320" y1="340" x2="1320" y2="347" stroke="#44586b"/><text x="1320" y="366">10¹⁵</text>
  </g>
  <text x="700" y="392" fill="#9fb3c8" font-size="15" text-anchor="middle">systemic dose (vg/kg)</text>
  <text x="34" y="210" fill="#9fb3c8" font-size="15" text-anchor="middle" transform="rotate(-90 34 210)">response</text>

  <!-- the usable band -->
  <rect x="700" y="80" width="280" height="260" fill="url(#win)"/>
  <line x1="700" y1="80" x2="700" y2="340" stroke="#2dd4bf" stroke-dasharray="5 4"/>
  <line x1="980" y1="80" x2="980" y2="340" stroke="#f43f5e" stroke-dasharray="5 4"/>
  <text x="840" y="70" fill="#2dd4bf" font-size="16" text-anchor="middle">usable window</text>

  <!-- efficacy -->
  <path d="M80,332 C300,330 420,320 520,270 C600,230 640,150 700,124 C800,100 1000,96 1320,94"
        fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <text x="432" y="252" fill="#2dd4bf" font-size="15">efficacy</text>

  <!-- toxicity -->
  <path d="M80,338 C500,337 700,334 830,320 C920,308 980,250 1030,186 C1080,126 1160,100 1320,92"
        fill="none" stroke="#f43f5e" stroke-width="3"/>
  <text x="1046" y="248" fill="#f43f5e" font-size="15">toxicity</text>

  <!-- what the toxicity actually is -->
  <g font-size="13">
    <line x1="1000" y1="214" x2="1092" y2="214" stroke="#3b4c5c"/>
    <text x="1100" y="150" fill="#fb923c" font-size="14">At the top of the range</text>
    <text x="1100" y="174" fill="#c5d6e4">Capsid-specific CD8 responses</text>
    <text x="1100" y="196" fill="#c5d6e4">Complement activation</text>
    <text x="1100" y="218" fill="#c5d6e4">Hepatotoxicity</text>
    <text x="1100" y="240" fill="#c5d6e4">Thrombotic microangiopathy</text>
    <text x="1100" y="262" fill="#c5d6e4">Dorsal root ganglion toxicity</text>
  </g>

  <!-- what blocks the bottom -->
  <g font-size="13">
    <text x="110" y="132" fill="#38bdf8" font-size="14">Before the dose even lands</text>
    <text x="110" y="156" fill="#c5d6e4">Pre-existing neutralising antibodies</text>
    <text x="110" y="178" fill="#c5d6e4">exclude a large share of patients —</text>
    <text x="110" y="200" fill="#c5d6e4">seroprevalence is serotype-dependent</text>
    <text x="110" y="222" fill="#c5d6e4">and highest for AAV2.</text>
    <text x="110" y="252" fill="#6d8aa3" font-size="12.5">Empty capsids add antigen without adding benefit,</text>
    <text x="110" y="270" fill="#6d8aa3" font-size="12.5">which is why full:empty is a release-critical attribute.</text>
  </g>

  <!-- the engineering argument -->
  <line x1="40" y1="416" x2="1360" y2="416" stroke="#1e2a36"/>
  <g>
    <path d="M700,452 L560,452" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#shift)"/>
    <text x="40" y="456" fill="#2dd4bf" font-size="16">Shift efficacy left</text>
    <text x="724" y="456" fill="#c5d6e4" font-size="15">
      A capsid that transduces target tissue better reaches the same effect at a lower dose —
    </text>
    <text x="724" y="480" fill="#c5d6e4" font-size="15">
      which widens the window from the side that is actually movable.
    </text>
    <text x="40" y="498" fill="#6d8aa3" font-size="13">This is the commercial</text>
    <text x="40" y="516" fill="#6d8aa3" font-size="13">argument for capsid engineering.</text>
  </g>
</svg>
