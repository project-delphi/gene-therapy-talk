<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="What the delivered AAV genome becomes. Top row: the released single strand with its T-shaped ITR hairpins is converted to double-stranded DNA, the ITR ends recombine by non-homologous end joining into a circular monomer, and monomers join head to tail into concatemers. Bottom row: the circle is wrapped in host nucleosomes into a chromatinised episome, which is transcribed by RNA polymerase II into mRNA and translated into the therapeutic protein. Annotations note that the episome is never integrated and is diluted by cell division, and that the MRN complex senses the hairpin ends.">
  <defs>
    <marker id="e-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a5f72"/>
    </marker>
    <marker id="e-arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#fbbf24"/>
    </marker>

    <!-- The ITR as the T-shaped hairpin it actually folds into. Stem joins the
         genome, crossbar is the palindromic arms. -->
    <g id="itr" stroke="#a78bfa" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M0,0 L17,0"/>
      <path d="M17,-13 L17,13"/>
      <path d="M17,-13 L28,-13 M17,13 L28,13"/>
    </g>

    <!-- One nucleosome: DNA wrapped on a histone octamer. -->
    <g id="nucleosome">
      <circle r="9" fill="#2b4a63" stroke="#7dd3fc" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- The slide heading names this figure; repeating it here just doubles it up. -->
  <text x="40" y="30" font-size="13" fill="#9fb3c8">The vector never integrates. It ends up as chromatin that the cell transcribes but does not copy.</text>

  <g transform="translate(0,-40)">

  <!-- ============== top row: linear to circular ============== -->
  <g>
    <!-- 1 · released single strand -->
    <rect x="40" y="86" width="286" height="150" rx="8" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="64" cy="110" r="13" fill="#fbbf24"/><text x="64" y="115" font-size="13" fill="#07090c" text-anchor="middle">1</text>
    <text x="86" y="115" font-size="14.5" fill="#f2f7fa">Released single strand</text>
    <g transform="translate(96,170)">
      <path d="M28,0 L106,0" stroke="#fbbf24" stroke-width="3.4" fill="none"/>
      <use href="#itr" transform="translate(28,0) rotate(180)"/>
      <use href="#itr" transform="translate(106,0)"/>
    </g>
    <text x="183" y="212" font-size="12" fill="#9fb3c8" text-anchor="middle">transcriptionally inert</text>

    <!-- 2 · second strand -->
    <rect x="356" y="86" width="286" height="150" rx="8" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="380" cy="110" r="13" fill="#fbbf24"/><text x="380" y="115" font-size="13" fill="#07090c" text-anchor="middle">2</text>
    <text x="402" y="115" font-size="14.5" fill="#f2f7fa">Made double-stranded</text>
    <g transform="translate(412,170)">
      <path d="M28,-5 L106,-5 M28,5 L106,5" stroke="#fbbf24" stroke-width="3.4" fill="none"/>
      <use href="#itr" transform="translate(28,0) rotate(180)"/>
      <use href="#itr" transform="translate(106,0)"/>
    </g>
    <text x="499" y="212" font-size="12" fill="#9fb3c8" text-anchor="middle">host polymerase — or snap-anneal, if scAAV</text>

    <!-- 3 · circularisation -->
    <rect x="672" y="86" width="286" height="150" rx="8" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="696" cy="110" r="13" fill="#fb923c"/><text x="696" y="115" font-size="13" fill="#07090c" text-anchor="middle">3</text>
    <text x="718" y="115" font-size="14.5" fill="#f2f7fa">Circularisation</text>
    <circle cx="815" cy="164" r="28" fill="none" stroke="#fbbf24" stroke-width="3.4"/>
    <circle cx="843" cy="164" r="6" fill="#fb923c"/>
    <text x="815" y="218" font-size="12" fill="#fb923c" text-anchor="middle">ITR ends joined by NHEJ — not integration</text>

    <!-- 4 · concatemer -->
    <rect x="988" y="86" width="372" height="150" rx="8" fill="#121a23" stroke="#2b3a48"/>
    <circle cx="1012" cy="110" r="13" fill="#fbbf24"/><text x="1012" y="115" font-size="13" fill="#07090c" text-anchor="middle">4</text>
    <text x="1034" y="115" font-size="14.5" fill="#f2f7fa">Head-to-tail concatemers</text>
    <circle cx="1174" cy="164" r="38" fill="none" stroke="#fbbf24" stroke-width="3.4"/>
    <g stroke="#fb923c" stroke-width="2.6" fill="none">
      <circle cx="1174" cy="126" r="5"/><circle cx="1207" cy="183" r="5"/><circle cx="1141" cy="183" r="5"/>
    </g>
    <g font-size="11.5" fill="#9fb3c8" text-anchor="middle">
      <text x="1174" y="160">cassette</text>
      <text x="1174" y="174">×3</text>
    </g>
    <text x="1174" y="224" font-size="12" fill="#9fb3c8" text-anchor="middle">where most vector DNA ends up</text>

    <!-- step arrows -->
    <line x1="330" y1="161" x2="352" y2="161" stroke="#4a5f72" stroke-width="2" marker-end="url(#e-arrow)"/>
    <line x1="646" y1="161" x2="668" y2="161" stroke="#4a5f72" stroke-width="2" marker-end="url(#e-arrow)"/>
    <line x1="962" y1="161" x2="984" y2="161" stroke="#4a5f72" stroke-width="2" marker-end="url(#e-arrow)"/>
  </g>

  <!-- the damage-response aside -->
  <rect x="988" y="248" width="372" height="56" rx="6" fill="#1b1522" stroke="#7c5aa6"/>
  <text x="1006" y="270" font-size="12.5" fill="#c4b5fd">MRN and ATM/ATR do sense those hairpin ends.</text>
  <text x="1006" y="290" font-size="12.5" fill="#c4b5fd">Tolerated, not undetected.</text>

  <!-- ============== bottom row: chromatin and expression ============== -->
  <line x1="40" y1="312" x2="1360" y2="312" stroke="#1d2935" stroke-width="2"/>

  <!-- 5 · chromatinised episome -->
  <text x="40" y="350" font-size="14.5" fill="#f2f7fa">5 · Chromatinised episome</text>
  <text x="40" y="372" font-size="12.5" fill="#9fb3c8">Host nucleosomes assemble on it. It behaves like a small extra chromosome —</text>
  <text x="40" y="390" font-size="12.5" fill="#9fb3c8">transcribed, but never replicated with the genome.</text>

  <g transform="translate(215,492)">
    <circle r="72" fill="none" stroke="#fbbf24" stroke-width="3.4"/>
    <g fill="#2b4a63" stroke="#7dd3fc" stroke-width="1.6">
      <circle cx="0"   cy="-72" r="10"/><circle cx="51"  cy="-51" r="10"/>
      <circle cx="72"  cy="0"   r="10"/><circle cx="51"  cy="51"  r="10"/>
      <circle cx="0"   cy="72"  r="10"/><circle cx="-51" cy="51"  r="10"/>
      <circle cx="-72" cy="0"   r="10"/><circle cx="-51" cy="-51" r="10"/>
    </g>
    <text x="0" y="-4" font-size="12" fill="#9fb3c8" text-anchor="middle">episome</text>
    <text x="0" y="14" font-size="11" fill="#7dd3fc" text-anchor="middle">+ nucleosomes</text>
  </g>

  <!-- transcription: Pol II riding the episome, not floating beside it -->
  <g>
    <ellipse cx="278" cy="452" rx="25" ry="19" fill="#2a3b50" stroke="#38bdf8" stroke-width="2"/>
    <text x="278" y="457" font-size="11" fill="#7dd3fc" text-anchor="middle">Pol II</text>
    <path d="M305,448 Q382,418 452,446" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#e-arrow)"/>
    <text x="380" y="412" font-size="12" fill="#38bdf8" text-anchor="middle">transcription</text>
  </g>

  <!-- mRNA -->
  <g transform="translate(470,470)">
    <path d="M0,0 q22,-22 44,0 q22,22 44,0 q22,-22 44,0" fill="none" stroke="#4ade80" stroke-width="3.4"/>
    <text x="66" y="42" font-size="12.5" fill="#4ade80" text-anchor="middle">mRNA</text>
  </g>

  <line x1="630" y1="470" x2="690" y2="470" stroke="#4a5f72" stroke-width="2" marker-end="url(#e-arrow)"/>

  <!-- ribosome -->
  <g transform="translate(740,470)">
    <ellipse cx="0" cy="-9" rx="26" ry="17" fill="#3d3352" stroke="#a78bfa" stroke-width="2"/>
    <ellipse cx="0" cy="13" rx="31" ry="14" fill="#2f2843" stroke="#a78bfa" stroke-width="2"/>
    <text x="0" y="52" font-size="12.5" fill="#a78bfa" text-anchor="middle">ribosome</text>
  </g>

  <line x1="790" y1="470" x2="850" y2="470" stroke="#4a5f72" stroke-width="2" marker-end="url(#e-arrow)"/>

  <!-- protein -->
  <g transform="translate(930,470)">
    <path d="M0,-32 C28,-32 43,-13 38,6 C34,28 12,40 -9,34 C-30,27 -40,6 -34,-13 C-29,-27 -15,-32 0,-32 Z"
          fill="#14323a" stroke="#2dd4bf" stroke-width="2.4"/>
    <path d="M-16,-10 q16,-13 31,2 M-18,9 q17,11 34,-5" fill="none"
          stroke="#2dd4bf" stroke-width="1.8" opacity="0.65"/>
    <text x="0" y="62" font-size="12.5" fill="#2dd4bf" text-anchor="middle">therapeutic protein</text>
  </g>

  <!-- the catch -->
  <rect x="1046" y="350" width="314" height="196" rx="8" fill="#1a1416" stroke="#8a4a4a"/>
  <text x="1068" y="382" font-size="14.5" fill="#fb7185">The bill for not integrating</text>
  <text x="1068" y="412" font-size="12.5" fill="#d8c0c4">Post-mitotic cells — neurons, muscle,</text>
  <text x="1068" y="430" font-size="12.5" fill="#d8c0c4">cardiomyocytes — hold the episome.</text>
  <text x="1068" y="462" font-size="12.5" fill="#d8c0c4">Dividing cells do not. Each division</text>
  <text x="1068" y="480" font-size="12.5" fill="#d8c0c4">halves the copies per cell, and the</text>
  <text x="1068" y="498" font-size="12.5" fill="#d8c0c4">paediatric liver is the clinical case.</text>
  <text x="1068" y="528" font-size="12.5" fill="#fb923c">You cannot simply redose.</text>

  <line x1="1012" y1="470" x2="1042" y2="470" stroke="#8a4a4a" stroke-width="2" marker-end="url(#e-arrow)"/>
  </g>
</svg>
